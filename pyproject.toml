[project]
name = "seacode"
version = "0.1.0"
description = "A local terminal AI coding agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.47.0",
    "openai>=1.60.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "textual>=2.1.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
]

[project.scripts]
sea = "seacode.__main__:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "types-pyyaml>=6.0.12.20250516",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# 提示词段落常量是长文本字符串，行长度限制不适用。
[tool.ruff.lint.per-file-ignores]
"seacode/prompts.py" = ["E501"]
"seacode/context/manager.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["seacode"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

# 协调者模式延迟 import 的模块由第 14 步创建，在此之前忽略缺失。
[[tool.mypy.overrides]]
module = "seacode.teams.*"
ignore_missing_imports = true
